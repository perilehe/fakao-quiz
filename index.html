<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>法考真金题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f0;--surface:#fff;--surface2:#fafaf7;--surface3:#f0f0eb;
  --text:#1a1a1a;--text2:#4a4a4a;--text3:#6b7280;
  --accent:#2563eb;--accent-light:#dbeafe;--accent-dark:#1d4ed8;
  --success:#059669;--success-light:#d1fae5;
  --danger:#dc2626;--danger-light:#fee2e2;
  --warning:#d97706;--warning-light:#fef3c7;
  --border:#e5e5e0;--radius:12px;--radius-sm:8px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tab-height:56px;
  --font-size:15px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#0f172a;--surface:#1e293b;--surface2:#334155;--surface3:#475569;
  --text:#e2e8f0;--text2:#cbd5e1;--text3:#94a3b8;
  --accent:#3b82f6;--accent-light:#1e3a5f;--accent-dark:#60a5fa;
  --success:#34d399;--success-light:#064e3b;
  --danger:#f87171;--danger-light:#7f1d1d;
  --warning:#fbbf24;--warning-light:#78350f;
  --border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a;--surface:#1e293b;--surface2:#334155;--surface3:#475569;
    --text:#e2e8f0;--text2:#cbd5e1;--text3:#94a3b8;
    --accent:#3b82f6;--accent-light:#1e3a5f;--accent-dark:#60a5fa;
    --success:#34d399;--success-light:#064e3b;
    --danger:#f87171;--danger-light:#7f1d1d;
    --warning:#fbbf24;--warning-light:#78350f;
    --border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-fs="small"]{--font-size:13px}
:root[data-fs="large"]{--font-size:17px}

html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--font-size);display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--tab-height);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding-bottom:var(--safe-bottom);z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;cursor:pointer;color:var(--text3);transition:color .15s;-webkit-user-select:none;user-select:none}
.tab-item.active{color:var(--accent)}
.tab-item .tab-icon{font-size:20px;line-height:1}
.tab-item .tab-label{font-size:10px;font-weight:600}

/* Screen */
.screen{display:none;flex-direction:column;height:100%;overflow:hidden;padding-bottom:var(--tab-height)}
.screen.active{display:flex}
.screen-header{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.screen-header .back-btn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.screen-header .back-btn:active{background:var(--surface3)}
.screen-header .title{font-size:17px;font-weight:700;flex:1}
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ===== HOME ===== */
.muti-banner{display:flex;align-items:center;gap:12px;margin:12px;padding:14px 16px;background:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 100%);border-radius:var(--radius);cursor:pointer;transition:all .15s;color:#fff}
.muti-banner:active{transform:scale(.98)}
.muti-banner-left{flex:1}
.muti-banner-title{font-size:16px;font-weight:800;margin-bottom:2px}
.muti-banner-sub{font-size:11px;opacity:.85}
.muti-banner-right{display:flex;gap:12px}
.muti-banner-stat{text-align:center;font-size:10px;opacity:.85}
.muti-banner-stat span{display:block;font-size:16px;font-weight:800;opacity:1}
.muti-banner-arrow{font-size:24px;opacity:.7;font-weight:300}
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.subject-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s}
.subject-card:active{transform:scale(.97)}
.subject-card .s-name{font-size:15px;font-weight:700;margin-bottom:8px}
.subject-card .s-stats{display:flex;flex-direction:column;gap:3px}
.subject-card .s-stat{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.subject-card .s-stat .val{font-weight:600;color:var(--text2)}
.subject-card .s-bar{height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.subject-card .s-bar-fill{height:100%;background:var(--accent);border-radius:2px}
.subject-card .empty{color:var(--text3);font-size:12px;text-align:center;padding:8px 0}

/* ===== CHAPTER ===== */
.chapter-list{padding:12px}
.chapter-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer}
.chapter-item:active{transform:scale(.98)}
.chapter-item .ch-name{font-size:14px;font-weight:600;margin-bottom:4px}
.chapter-item .ch-stats{display:flex;gap:12px;font-size:11px;color:var(--text3)}
.chapter-item .ch-stats .val{font-weight:600;color:var(--text2)}
.chapter-actions{display:flex;gap:8px;margin-top:8px}
.chapter-btn{flex:1;height:32px;border-radius:16px;border:none;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.chapter-btn.primary{background:var(--accent);color:#fff}
.chapter-btn.secondary{background:var(--accent-light);color:var(--accent)}
.chapter-btn:active{transform:scale(.95)}
.full-random-btn{width:100%;height:44px;border-radius:22px;border:none;font-size:14px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.full-random-btn:active{transform:scale(.97)}

/* Filter */
.filter-bar{display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.filter-chip{padding:4px 12px;border-radius:12px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text3);transition:all .15s;white-space:nowrap}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-chip:active{transform:scale(.95)}

/* ===== REVIEW DASHBOARD ===== */
.review-body{padding:12px}
.review-hero{text-align:center;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px}
.review-hero .rh-today{font-size:48px;font-weight:800;color:var(--danger)}
.review-hero .rh-label{font-size:13px;color:var(--text3);margin-top:4px}
.review-hero .rh-sub{font-size:12px;color:var(--text3);margin-top:2px}
.review-start-btn{width:100%;height:48px;border-radius:24px;border:none;font-size:16px;font-weight:700;background:var(--danger);color:#fff;cursor:pointer;margin-top:12px}
.review-start-btn:active{transform:scale(.97)}
.review-start-btn:disabled{opacity:.5}

.review-stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.review-stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center}
.review-stat-card .rsc-val{font-size:20px;font-weight:800}
.review-stat-card .rsc-label{font-size:10px;color:var(--text3);margin-top:2px}

.review-schedule{margin-bottom:12px}
.review-schedule-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text2)}
.schedule-day{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:4px}
.schedule-day.today{border-color:var(--danger);background:var(--danger-light)}
.schedule-day .sd-date{font-size:12px;color:var(--text3);width:50px;flex-shrink:0}
.schedule-day .sd-label{font-size:12px;font-weight:600;flex:1}
.schedule-day .sd-count{font-size:14px;font-weight:700}

/* ===== QUIZ ===== */
.quiz-top{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.quiz-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.quiz-back-btn{font-size:13px;color:var(--accent);cursor:pointer;padding:4px 8px;border-radius:6px;user-select:none}
.quiz-back-btn:active{background:var(--accent-light)}
.quiz-search-btn{font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px}
.quiz-search-btn:active{background:var(--accent-light)}
.quiz-search-bar{display:flex;gap:8px;margin-top:8px;margin-bottom:6px}
.quiz-search-bar input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text)}
.quiz-search-bar button{padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.quiz-search-bar button:active{opacity:.8}
.quiz-top .quiz-meta{display:flex;align-items:center;justify-content:space-between}
.quiz-top .quiz-meta .progress-text{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.quiz-top .quiz-meta .chapter-name{font-size:11px;color:var(--accent);font-weight:600}
.quiz-top .quiz-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.quiz-top .quiz-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.quiz-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

.q-type-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.q-type-tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--accent-light);color:var(--accent)}
.q-type-tag.multi{background:var(--warning-light);color:var(--warning)}
.q-type-tag.uncertain{background:var(--danger-light);color:var(--danger)}
.q-source{font-size:11px;color:var(--text3)}
.q-answer-hint{font-size:11px;color:var(--text3);margin-left:auto;cursor:pointer;user-select:none}
.q-answer-hint .hint-num{font-weight:600;color:var(--accent)}

.q-text{font-size:16px;line-height:1.8;font-weight:500;margin-bottom:16px;white-space:pre-wrap}
.q-diagrams{margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.q-diagrams img{max-width:100%;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer}
.q-diagrams img:active{opacity:.8}
.q-options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.q-option{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;font-size:var(--font-size);line-height:1.6}
.q-option:active{transform:scale(.98)}
.q-option .opt-mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;transition:all .15s}
.q-option.selected{border-color:var(--accent);background:var(--accent-light)}
.q-option.selected .opt-mark{background:var(--accent);color:#fff;border-color:var(--accent)}
.q-option.correct{border-color:var(--success);background:var(--success-light)}
.q-option.correct .opt-mark{background:var(--success);color:#fff;border-color:var(--success)}
.q-option.wrong{border-color:var(--danger);background:var(--danger-light)}
.q-option.wrong .opt-mark{background:var(--danger);color:#fff;border-color:var(--danger)}
.q-option.locked{pointer-events:none}
.q-option .unsure-btn{margin-left:auto;padding:2px 6px;border-radius:8px;border:1px solid var(--border);font-size:10px;color:var(--text3);cursor:pointer;background:var(--surface);flex-shrink:0;pointer-events:auto}
.q-option .unsure-btn.active{border-color:var(--warning);color:var(--warning);background:var(--warning-light)}

.q-submit-btn{width:100%;height:48px;border-radius:24px;border:none;font-size:15px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;margin-bottom:12px}
.q-submit-btn:active{transform:scale(.97)}
.q-submit-btn:disabled{opacity:.5;pointer-events:none}
.q-next-btn{width:100%;height:48px;border-radius:24px;border:none;font-size:15px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;margin-top:12px;display:none}
.q-next-btn.show{display:block}
.q-next-btn:active{transform:scale(.97)}

.q-explanation{margin-top:12px;padding:14px;background:var(--surface2);border-radius:var(--radius);border-left:3px solid var(--accent);display:none}
.q-explanation.show{display:block}
.q-explanation .exp-label{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;letter-spacing:1px}
.q-explanation .exp-text{font-size:14px;line-height:1.8;white-space:pre-wrap}
.q-kp-badge{position:relative;font-size:11px;color:var(--accent);cursor:pointer;user-select:none;padding:2px 8px;border:1px solid var(--accent-light);border-radius:12px;background:var(--accent-light);margin-left:6px;display:inline-flex;align-items:center;gap:4px}
.q-kp-badge .kp-label{font-weight:500}
.q-kp-badge .kp-tags{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:60vw;max-height:40vh;overflow-y:auto;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:13px;color:var(--accent);z-index:100;line-height:1.8;word-break:break-all}
.q-kp-badge.open .kp-tags{display:block}

/* Review level indicator */
.q-review-indicator{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:var(--text3)}
.q-review-dots{display:flex;gap:3px}
.q-review-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.q-review-dot.filled{background:var(--accent)}
.q-review-dot.max{background:var(--success)}

/* ===== WRONG ===== */
.wrong-filters{display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.wrong-list{padding:12px}
.wrong-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer}
.wrong-item:active{transform:scale(.98)}
.wrong-item .wq{font-size:14px;line-height:1.6;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrong-item .wmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text3)}
.wrong-item .wmeta .tag{padding:1px 6px;border-radius:8px;background:var(--surface3)}
.wrong-item .wmeta .wrong-count{color:var(--danger);font-weight:600}

/* ===== STATS ===== */
.stats-body{padding:16px}
.stats-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stats-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stats-card .sc-val{font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.stats-card .sc-label{font-size:11px;color:var(--text3);margin-top:2px}
.stats-section{margin-bottom:16px}
.stats-section-title{font-size:14px;font-weight:700;margin-bottom:8px}
.bar-chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{width:60px;font-size:12px;color:var(--text3);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:20px;background:var(--surface3);border-radius:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:10px;transition:width .5s}
.bar-val{font-size:11px;font-weight:600;width:40px;text-align:left;flex-shrink:0}

.stats-table{width:100%;border-collapse:collapse;font-size:13px}
.stats-table th{background:var(--surface3);color:var(--text3);font-size:11px;font-weight:600;padding:6px 8px;text-align:center;white-space:nowrap}
.stats-table th:first-child,.stats-table td:first-child{text-align:left}
.stats-table td{padding:8px;text-align:center;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.stats-table .total-row{font-weight:700;background:var(--surface2)}
.stats-table .total-row td{border-top:2px solid var(--accent);border-bottom:none}

/* Daily log */
.daily-log{margin-top:16px}
.daily-log-title{font-size:14px;font-weight:700;margin-bottom:8px}
.daily-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px}
.daily-item .di-date{font-size:12px;color:var(--text3);width:70px}
.daily-item .di-info{flex:1;font-size:12px}
.daily-item .di-count{font-size:14px;font-weight:700;color:var(--accent)}

/* ===== SETTINGS ===== */
.settings-body{padding:16px}
.setting-group{margin-bottom:16px}
.setting-group-title{font-size:12px;font-weight:700;color:var(--text3);margin-bottom:8px;letter-spacing:1px}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer}
.setting-item:active{background:var(--surface2)}
.setting-item .si-label{font-size:14px;font-weight:500}
.setting-item .si-value{font-size:13px;color:var(--text3)}
.setting-btn{width:100%;height:44px;border-radius:var(--radius);border:1px solid var(--border);font-size:14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.setting-btn:active{background:var(--surface2)}
.setting-btn.danger{border-color:var(--danger);color:var(--danger)}

/* Modal */
.modal-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:70vh;padding:20px 16px calc(20px + var(--safe-bottom));overflow-y:auto}

.quiz-summary{text-align:center;padding:20px 16px}
.quiz-summary .qs-circle{width:120px;height:120px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column}
.quiz-summary .qs-circle .pct{font-size:36px;font-weight:800}
.quiz-summary .qs-circle .label{font-size:12px;color:var(--text3)}
.quiz-summary .qs-details{display:flex;justify-content:center;gap:24px;margin:16px 0;font-size:14px}
.quiz-summary .qs-details .item{display:flex;flex-direction:column;align-items:center;gap:4px}
.quiz-summary .qs-details .num{font-size:24px;font-weight:700}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-text{font-size:14px}

::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>

<!-- Tab Bar -->
<nav class="tab-bar">
  <div class="tab-item active" data-tab="home" onclick="switchTab('home')"><span class="tab-icon">📚</span><span class="tab-label">首页</span></div>
  <div class="tab-item" data-tab="review" onclick="switchTab('review')"><span class="tab-icon">🔁</span><span class="tab-label">复习</span></div>
  <div class="tab-item" data-tab="wrong" onclick="switchTab('wrong')"><span class="tab-icon">❌</span><span class="tab-label">错题</span></div>
  <div class="tab-item" data-tab="stats" onclick="switchTab('stats')"><span class="tab-icon">📊</span><span class="tab-label">统计</span></div>
  <div class="tab-item" data-tab="settings" onclick="switchTab('settings')"><span class="tab-icon">⚙️</span><span class="tab-label">设置</span></div>
</nav>

<!-- Screen: Home -->
<div class="screen active" id="screen-home">
  <div class="screen-header"><div class="title">法考<span style="color:var(--accent)">真金题</span></div></div>
  <div class="screen-body" id="home-body"></div>
</div>

<!-- Screen: Chapters -->
<div class="screen" id="screen-chapters">
  <div class="screen-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="title" id="ch-subject-title">民诉</div>
  </div>
  <div class="filter-bar" id="ch-filter">
    <div class="filter-chip active" data-filter="all" onclick="setFilter(this,'all')">全部</div>
    <div class="filter-chip" data-filter="single" onclick="setFilter(this,'single')">单选</div>

<script>
// ================================================================
//  CONSTANTS & STATE
// ================================================================
const STORE_KEY = 'fakao_zhenti_v2';
const MUTI_KEY  = 'fakao_muti_v1';

// 冲刺型遗忘曲线间隔（天）：等级0=当天, 1=1天, 2=3天, 3=5天, 4=7天, 5=已掌握
const REVIEW_INTERVALS = [0, 1, 3, 5, 7, 999];
const REVIEW_LABELS = ['重做', '1天后', '3天后', '5天后', '7天后', '已掌握'];

let STORE = { version: 2, questions: [], records: {}, dailyLog: {}, settings: { theme: 'auto', fontSize: 'medium' } };
let MUTI_STORE = { version: 1, questions: [], records: {}, dailyLog: {} };
let ACTIVE_STORE = STORE; // 当前活跃的题库指针（切换真金题/母题）
let CURRENT_SUBJECT = null, CURRENT_FILTER = 'all', WRONG_FILTER = 'all';
let QUIZ_QUESTIONS = [], QUIZ_INDEX = 0, QUIZ_SELECTED = [], QUIZ_SUBMITTED = false;
let QUIZ_RESULT = { correct: 0, wrong: 0 };
let lastQuizConfig = { mode: 'random', subject: null, chapter: null, filter: 'all', isReview: false };

const SUBJECTS = {
  ms:{name:'民诉',fullName:'民事诉讼法'},xk:{name:'刑法',fullName:'刑法'},
  mf:{name:'民法',fullName:'民法'},xs:{name:'刑诉',fullName:'刑事诉讼法'},
  xz:{name:'行政法',fullName:'行政法'},sj:{name:'商经知',fullName:'商经知'},
  sg:{name:'三国法',fullName:'三国法'},ll:{name:'理论法',fullName:'理论法'},
};

// ================================================================
//  DATA
// ================================================================
function loadStore(){
  try{const d=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');if(d.version)STORE=d;}catch(e){}
  try{const m=JSON.parse(localStorage.getItem(MUTI_KEY)||'{}');if(m.version)MUTI_STORE=m;}catch(e){}
  // 自动迁移：把混在真金题STORE里的母题剥离到MUTI_STORE
  migrateMutiFromZhenti();
  ACTIVE_STORE = STORE;
  applySettings();
}

// 迁移：把STORE中误入的母题（id含'-muti-'）搬到MUTI_STORE，保留做题记录
function migrateMutiFromZhenti(){
  const mutiQs=STORE.questions.filter(q=>q.id&&q.id.includes('-muti-'));
  if(mutiQs.length===0)return;
  let moved=0,migratedRecords=0;
  mutiQs.forEach(q=>{
    // 把题目搬到MUTI_STORE（去重）
    if(!MUTI_STORE.questions.find(e=>e.id===q.id)){
      MUTI_STORE.questions.push(q);
      moved++;
    }
    // 把做题记录搬到MUTI_STORE
    if(STORE.records[q.id]){
      if(!MUTI_STORE.records[q.id]){
        MUTI_STORE.records[q.id]={...STORE.records[q.id]};
        migratedRecords++;
      }
      delete STORE.records[q.id];
    }
  });
  // 一次性从STORE中移除所有母题
  const mutiIds=new Set(mutiQs.map(q=>q.id));
  STORE.questions=STORE.questions.filter(q=>!mutiIds.has(q.id));
  saveStore();
  saveMutiStore();
  console.log(`🔄 母题迁移完成：移动 ${moved} 道题，迁移 ${migratedRecords} 条做题记录`);
}
function saveStore(){localStorage.setItem(STORE_KEY,JSON.stringify(STORE));}
function saveMutiStore(){localStorage.setItem(MUTI_KEY,JSON.stringify(MUTI_STORE));}
function saveActiveStore(){if(ACTIVE_STORE===MUTI_STORE)saveMutiStore();else saveStore();}

function applySettings(){
  const s=STORE.settings,root=document.documentElement;
  if(s.theme&&s.theme!=='auto')root.setAttribute('data-theme',s.theme);
  else if(s.theme==='auto')root.removeAttribute('data-theme');
  if(s.fontSize)root.setAttribute('data-fs',s.fontSize);
}

function todayStr(){
  // Use Hong Kong time (UTC+8) for date calculations
  const now=new Date();
  const hkOffset=8*60*60*1000; // UTC+8 in ms
  const hkTime=new Date(now.getTime()+hkOffset);
  return hkTime.toISOString().slice(0,10);
}

// ================================================================
//  SPACED REPETITION ENGINE
// ================================================================
function getReviewRecord(qid){
  if(!ACTIVE_STORE.records[qid]) ACTIVE_STORE.records[qid]={attempts:0,correct:0,lastAnswer:[],lastResult:false,unsureOpts:[],wrongCount:0,reviewLevel:0,nextReview:null,consecutiveCorrect:0};
  return ACTIVE_STORE.records[qid];
}

// 判断题目今天是否应该复习
function isDueToday(qid){
  const rec = ACTIVE_STORE.records[qid];
  if(!rec) return true; // 新题
  if(rec.reviewLevel >= 5) return false; // 已掌握
  if(!rec.nextReview) return true; // 没有下次复习日期
  return rec.nextReview <= todayStr();
}

// 更新复习等级（答对/答错后调用）
function updateReviewLevel(qid, isCorrect){
  const rec = getReviewRecord(qid);
  if(isCorrect){
    rec.consecutiveCorrect = (rec.consecutiveCorrect||0) + 1;
    // 连续答对2次 → 已掌握
    if(rec.consecutiveCorrect >= 2 && rec.reviewLevel >= 3){
      rec.reviewLevel = 5; // 已掌握
      rec.nextReview = null;
    } else {
      rec.reviewLevel = Math.min(rec.reviewLevel + 1, 4);
      rec.nextReview = addDays(todayStr(), REVIEW_INTERVALS[rec.reviewLevel]);
    }
  } else {
    rec.consecutiveCorrect = 0;
    rec.wrongCount = (rec.wrongCount||0) + 1;
    rec.reviewLevel = 0; // 直接降回重做
    rec.nextReview = todayStr(); // 今天重做
  }
  saveActiveStore();
}

function addDays(dateStr, days){
  if(days >= 999) return null;
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

// 获取今日待复习题目
function getDueQuestions(subjectKey){
  return ACTIVE_STORE.questions.filter(q => {
    if(subjectKey && q.subject !== subjectKey) return false;
    return isDueToday(q.id);
  });
}

// 获取未来7天复习计划
function getWeekSchedule(subjectKey){
  const schedule = [];
  for(let i = 0; i <= 6; i++){
    const date = addDays(todayStr(), i);
    const qs = ACTIVE_STORE.questions.filter(q => {
      if(subjectKey && q.subject !== subjectKey) return false;
      if(!ACTIVE_STORE.records[q.id]) return i === 0; // 新题归入今天
      const rec = ACTIVE_STORE.records[q.id];
      if(rec.reviewLevel >= 5) return false;
      return rec.nextReview === date;
    });
    schedule.push({ date, count: qs.length, isToday: i === 0, label: i === 0 ? '今天' : i === 1 ? '明天' : (new Date(date).getMonth()+1) + '/' + new Date(date).getDate() });
  }
  return schedule;
}

// 记录每日做题
function logDaily(count, correct){
  const today = todayStr();
  if(!ACTIVE_STORE.dailyLog[today]) ACTIVE_STORE.dailyLog[today] = { count: 0, correct: 0 };
  ACTIVE_STORE.dailyLog[today].count += count;
  ACTIVE_STORE.dailyLog[today].correct += correct;
  saveActiveStore();
}

// ================================================================
//  TAB NAVIGATION
// ================================================================
function switchTab(tab){
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  if(tab==='home'){ACTIVE_STORE=STORE;renderHome();}
  if(tab==='review')renderReview();
  if(tab==='wrong')renderWrong();
  if(tab==='stats')renderStats();
  if(tab==='settings')renderSettings();
}
function goHome(){switchTab('home');}

// ================================================================
//  HOME
// ================================================================
function renderHome(){
  const body=document.getElementById('home-body');
  // 母题题库横幅入口
  const mutiTotal=MUTI_STORE.questions.length;
  const mutiAttempted=Object.keys(MUTI_STORE.records).filter(id=>MUTI_STORE.records[id]&&MUTI_STORE.records[id].attempts>0).length;
  let mutiAcc=0,mutiAtt=0,mutiCor=0;
  Object.values(MUTI_STORE.records).forEach(r=>{if(r){mutiAtt+=r.attempts;mutiCor+=r.correct;}});
  mutiAcc=mutiAtt>0?Math.round(mutiCor/mutiAtt*100):0;
  let html=`<div class="muti-banner" onclick="enterMutiHome()">
    <div class="muti-banner-left">
      <div class="muti-banner-title">⭐ 母题精选</div>
      <div class="muti-banner-sub">7科 × 25题 · 核心母题</div>
    </div>
    <div class="muti-banner-right">
      <div class="muti-banner-stat"><span>${mutiTotal}</span>题</div>
      <div class="muti-banner-stat"><span>${mutiAttempted}</span>已做</div>
      <div class="muti-banner-stat"><span>${mutiAcc}%</span>正确率</div>
    </div>
    <div class="muti-banner-arrow">›</div>
  </div>`;
  html+='<div style="padding:4px 12px 0;font-size:13px;font-weight:700;color:var(--text3)">📚 真金题</div>';
  html+='<div class="subject-grid">';
  for(const[key,subj]of Object.entries(SUBJECTS)){
    const qs=STORE.questions.filter(q=>q.subject===key);
    const total=qs.length;
    if(total===0){html+=`<div class="subject-card" onclick="enterSubject('${key}')"><div class="s-name">${subj.name}</div><div class="empty">暂无题目</div></div>`;continue;}
    const done=qs.filter(q=>STORE.records[q.id]).length;
    const attempted=qs.filter(q=>STORE.records[q.id]&&STORE.records[q.id].attempts>0).length;
    let correct=0,attempts=0;
    qs.forEach(q=>{const r=STORE.records[q.id];if(r){attempts+=r.attempts;correct+=r.correct;}});
    const acc=attempts>0?Math.round(correct/attempts*100):0;
    const pct=total>0?Math.round(attempted/total*100):0;
    html+=`<div class="subject-card" onclick="enterSubject('${key}')">
      <div class="s-name">${subj.name}</div>
      <div class="s-stats">
        <div class="s-stat"><span>总题数</span><span class="val">${total}</span></div>
        <div class="s-stat"><span>累计已做</span><span class="val" style="color:var(--accent)">${attempted}</span></div>
        <div class="s-stat"><span>正确率</span><span class="val">${acc}%</span></div>
      </div>
      <div class="s-bar"><div class="s-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }
  html+='</div>';
  if(STORE.questions.length===0){
    html+=`<div style="padding:20px 16px;text-align:center"><div style="font-size:48px;margin-bottom:12px">📥</div><div style="font-size:14px;color:var(--text3);margin-bottom:12px">题库为空，请先导入题目</div><button class="setting-btn" style="background:var(--accent);color:#fff;border:none;max-width:200px;margin:0 auto" onclick="document.getElementById('jsonFileInput').click()">导入 JSON 题库</button></div>`;
  }
  body.innerHTML=html;
}

// ================================================================
//  MUTI HOME (母题题库 - 独立题库)
// ================================================================
function enterMutiHome(){
  // 如果母题题库为空，提示先加载
  if(MUTI_STORE.questions.length===0){
    if(confirm('母题题库为空，是否立即加载？')){loadMutiQuestions();}
    return;
  }
  ACTIVE_STORE=MUTI_STORE;
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-chapters').classList.add('active');
  document.getElementById('ch-subject-title').textContent='⭐ 母题题库';
  // 渲染母题7科列表
  renderMutiSubjects();
}

function renderMutiSubjects(){
  const body=document.getElementById('chapters-body');
  // 收集母题中有的科目
  const mutiSubjects={};
  for(const[key,subj]of Object.entries(SUBJECTS)){
    const qs=MUTI_STORE.questions.filter(q=>q.subject===key);
    if(qs.length>0)mutiSubjects[key]={...subj,count:qs.length};
  }
  const keys=Object.keys(mutiSubjects);
  if(keys.length===0){body.innerHTML='<div class="empty-state"><div class="es-icon">⭐</div><div class="es-text">母题题库为空</div></div>';return;}
  let html='<div style="padding:12px 16px 4px;font-size:12px;color:var(--text3)">选择科目进入母题练习 · 共 '+MUTI_STORE.questions.length+' 题</div>';
  html+='<div class="subject-grid">';
  keys.forEach(key=>{
    const subj=mutiSubjects[key];
    const qs=MUTI_STORE.questions.filter(q=>q.subject===key);
    const attempted=qs.filter(q=>MUTI_STORE.records[q.id]&&MUTI_STORE.records[q.id].attempts>0).length;
    let att=0,cor=0;
    qs.forEach(q=>{const r=MUTI_STORE.records[q.id];if(r){att+=r.attempts;cor+=r.correct;}});
    const acc=att>0?Math.round(cor/att*100):0;
    const pct=subj.count>0?Math.round(attempted/subj.count*100):0;
    html+=`<div class="subject-card" onclick="enterMutiSubject('${key}')">
      <div class="s-name">${subj.name}</div>
      <div class="s-stats">
        <div class="s-stat"><span>题数</span><span class="val">${subj.count}</span></div>
        <div class="s-stat"><span>已做</span><span class="val" style="color:var(--accent)">${attempted}</span></div>
        <div class="s-stat"><span>正确率</span><span class="val">${acc}%</span></div>
      </div>
      <div class="s-bar"><div class="s-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  });
  html+='</div>';
  // 返回按钮
  html=`<div style="padding:12px 16px"><button class="setting-btn" style="background:var(--surface3);color:var(--text);border:none;width:100%" onclick="goHome()">← 返回真金题首页</button></div>`+html;
  body.innerHTML=html;
}

function enterMutiSubject(key){
  ACTIVE_STORE=MUTI_STORE;
  CURRENT_SUBJECT=key;CURRENT_FILTER='all';
  document.querySelectorAll('#ch-filter .filter-chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('#ch-filter .filter-chip[data-filter="all"]').classList.add('active');
  document.getElementById('ch-subject-title').textContent='⭐ '+SUBJECTS[key].name+'母题';
  renderChapters();
}

// ================================================================
//  CHAPTERS
// ================================================================
function enterSubject(key){
  ACTIVE_STORE=STORE;
  CURRENT_SUBJECT=key;CURRENT_FILTER='all';
  document.querySelectorAll('#ch-filter .filter-chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('#ch-filter .filter-chip[data-filter="all"]').classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-chapters').classList.add('active');
  document.getElementById('ch-subject-title').textContent=SUBJECTS[key].name;
  renderChapters();
}
function setFilter(el,f){document.querySelectorAll('#ch-filter .filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');CURRENT_FILTER=f;renderChapters();}

function getChapters(subjectKey,filter){
  let qs=ACTIVE_STORE.questions.filter(q=>q.subject===subjectKey);
  if(filter&&filter!=='all')qs=qs.filter(q=>q.type===filter);
  const chapters={};qs.forEach(q=>{const ch=q.chapter||'未分类';if(!chapters[ch])chapters[ch]=[];chapters[ch].push(q);});
  return chapters;
}

function renderChapters(){
  const body=document.getElementById('chapters-body');
  const chapters=getChapters(CURRENT_SUBJECT,CURRENT_FILTER);
  const keys=Object.keys(chapters);
  if(keys.length===0){body.innerHTML='<div class="empty-state"><div class="es-icon"></div><div class="es-text">暂无题目</div></div>';return;}
  let html='<div class="chapter-list">';
  const total=keys.reduce((s,k)=>s+chapters[k].length,0);
  html+=`<button class="full-random-btn" onclick="startQuiz({mode:'random',subject:'${CURRENT_SUBJECT}',chapter:null,filter:'${CURRENT_FILTER}'})">🎲 全书随机 (${total} 题)</button>`;
  keys.forEach(ch=>{
    const qs=chapters[ch];const done=qs.filter(q=>ACTIVE_STORE.records[q.id]&&ACTIVE_STORE.records[q.id].attempts>0).length;
    let correct=0,attempts=0;qs.forEach(q=>{const r=ACTIVE_STORE.records[q.id];if(r){attempts+=r.attempts;correct+=r.correct;}});
    const acc=attempts>0?Math.round(correct/attempts*100):0;
    html+=`<div class="chapter-item"><div class="ch-name">${escHtml(ch)}</div>
      <div class="ch-stats"><span>题数 <span class="val">${qs.length}</span></span><span>已做 <span class="val">${done}</span></span><span>正确率 <span class="val">${acc}%</span></span></div>
      <div class="chapter-actions">
        <button class="chapter-btn primary" data-ch="${escHtml(ch)}" onclick="doChapterQuiz(this,'sequential')">📖 做本章题</button>
        <button class="chapter-btn secondary" data-ch="${escHtml(ch)}" onclick="doChapterQuiz(this,'random')">🎲 本章随机</button>
      </div></div>`;
  });
  html+='</div>';body.innerHTML=html;
}

function doChapterQuiz(btn,mode){
  const ch=btn.getAttribute('data-ch');
  startQuiz({mode,subject:CURRENT_SUBJECT,chapter:ch,filter:CURRENT_FILTER});
}

function exitQuiz(){
  if(!QUIZ_SUBMITTED&&QUIZ_SELECTED.length>0){
    if(!confirm('正在答题中，确定退出吗？当前进度不会保存。'))return;
  }
  // Return to chapter list (previous level), not main menu
  const wasMuti=(ACTIVE_STORE===MUTI_STORE);
  if(lastQuizConfig&&lastQuizConfig.subject){
    if(wasMuti)enterMutiSubject(lastQuizConfig.subject);
    else enterSubject(lastQuizConfig.subject);
  }else{
    goHome();
  }
}

function toggleQuizSearch(){
  const bar=document.getElementById('quiz-search-bar');
  bar.style.display=bar.style.display==='none'?'flex':'none';
  if(bar.style.display==='flex')document.getElementById('quiz-search-input').focus();
}

function searchQuestion(){
  const input=document.getElementById('quiz-search-input').value.trim();
  if(!input)return;
  let q;
  if(input==='diagram'||input==='图'||input==='配图'){
    q=ACTIVE_STORE.questions.find(q=>q.diagrams&&q.diagrams.length>0);
    if(!q){alert('没有找到有配图的题目');return;}
  }else{
    // 优先精确匹配ID，再匹配source
    q=ACTIVE_STORE.questions.find(q=>q.id===input)||ACTIVE_STORE.questions.find(q=>q.source===input||q.source.includes(input));
  }
  if(!q){alert('未找到题目：'+input+'\n当前题库共'+ACTIVE_STORE.questions.length+'题');return;}
  QUIZ_QUESTIONS=[q];QUIZ_INDEX=0;QUIZ_RESULT={correct:0,wrong:0,total:1};
  document.getElementById('screen-quiz').classList.add('active');
  renderQuestion();
  document.getElementById('quiz-search-bar').style.display='none';
  document.getElementById('quiz-search-input').value='';
}

async function syncFromServer(){
  const btn=event?event.target:null;
  if(btn){btn.textContent='同步中...';btn.disabled=true;}
  try{
    const resp=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    const imported=data.questions||[];
    if(imported.length===0){alert('服务器题库为空');return;}
    let newCount=0,updateCount=0;
    imported.forEach(item=>{
      let ans=item.ans||item.answer||[];if(typeof ans==='string')ans=ans.split('');
      const q={
        id:item.id||('imp_'+Date.now()+'_'+newCount),
        subject:item.subject||detectSubject(item),
        book:item.book||'',chapter:item.chapter||'未分类',
        year:item.year||null,source:item.source||item.meta||'',
        type:item.type||(ans.length>1?'multi':'single'),
        answerCount:ans.length,q:item.q||item.question||'',
        opts:item.opts||item.options||{},ans:ans,
        exp:item.exp||item.explanation||'',
        keypoints:item.keypoints||[],difficulty:item.difficulty||null,page:item.page||null,
        diagrams:item.diagrams||[],
      };
      if(q.q&&Object.keys(q.opts).length>=2&&q.ans.length>0){
        const existing=STORE.questions.find(e=>e.id===q.id);
        if(existing){
          // Update question content (q, opts, exp, keypoints, diagrams, etc.)
          // but do NOT touch STORE.records - user progress is preserved
          Object.assign(existing,q);
          updateCount++;
        }else{
          STORE.questions.push(q);
          newCount++;
        }
      }
    });
    saveStore();
    const msg=`✅ 同步完成！\n新增 ${newCount} 道题\n更新 ${updateCount} 道题内容\n答题记录已保留\n当前共 ${STORE.questions.length} 题`;
    alert(msg);
    if(btn){btn.textContent='🔄 从服务器同步题库';btn.disabled=false;}
    renderSettings();
  }catch(e){
    alert('❌ 同步失败：'+e.message);
    if(btn){btn.textContent='🔄 从服务器同步题库';btn.disabled=false;}
  }
}

function startQuiz(config){
  lastQuizConfig=config;
  const{mode,subject,chapter,filter,isReview}=config;
  let pool=ACTIVE_STORE.questions.filter(q=>q.subject===subject);
  if(chapter)pool=pool.filter(q=>q.chapter===chapter);
  if(filter&&filter!=='all')pool=pool.filter(q=>q.type===filter);
  if(isReview)pool=pool.filter(q=>isDueToday(q.id));
  if(pool.length===0){alert('没有符合条件的题目！');return;}

  // Random mode: prioritize questions never attempted (attempts===0)
  if(mode==='random'){
    const unseen=pool.filter(q=>{const r=ACTIVE_STORE.records[q.id];return !r||r.attempts===0;});
    if(unseen.length>0){
      pool=unseen;
      showToast('📝 还有 '+unseen.length+' 题未做过');
    }else{
      // All questions have been attempted at least once
      if(confirm('本范围所有题目都已至少做过一遍！\n是否清零重新开始？（正确率等统计将归零）')){
        pool.forEach(q=>{delete ACTIVE_STORE.records[q.id];});
        saveActiveStore();
        showToast('🔄 已清零，重新开始');
        pool=pool.filter(q=>{const r=ACTIVE_STORE.records[q.id];return !r||r.attempts===0;});
      }
      // else: continue with full pool for review
    }
    pool.sort(()=>Math.random()-.5);
  }else if(mode==='unseen'){
    pool=pool.filter(q=>{const r=ACTIVE_STORE.records[q.id];return !r||r.attempts===0;});
    if(pool.length===0){alert('所有题目都已至少做过一次！');return;}
    pool.sort(()=>Math.random()-.5);
  }else if(mode==='wrong'||mode==='review'){
    pool.sort(()=>Math.random()-.5);
  }

  QUIZ_QUESTIONS=pool;QUIZ_INDEX=0;QUIZ_RESULT={correct:0,wrong:0};
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-quiz').classList.add('active');
  renderQuestion();
}

function renderQuestion(){
  if(QUIZ_INDEX>=QUIZ_QUESTIONS.length){showQuizSummary();return;}
  QUIZ_SUBMITTED=false;QUIZ_SELECTED=[];
  const q=QUIZ_QUESTIONS[QUIZ_INDEX];
  const total=QUIZ_QUESTIONS.length;
  document.getElementById('qz-chapter').textContent=q.chapter||'未分类';
  document.getElementById('qz-progress').textContent=(QUIZ_INDEX+1)+'/'+total;
  document.getElementById('qz-bar').style.width=(QUIZ_INDEX/total*100)+'%';

  const qType=q.type||(q.ans.length>1?'multi':'single');
  const typeLabel=qType==='single'?'单选':qType==='multi'?'多选':'不定项';
  const typeClass=qType==='single'?'':qType==='multi'?'multi':'uncertain';
  const answerHint=qType!=='single'?`<span class="q-answer-hint" onclick="this.classList.toggle('revealed');this.querySelector('.hint-num').textContent=this.classList.contains('revealed')?'${q.ans.length}':'?'">本题 <span class="hint-num">?</span> 选</span>`:'';

  // Review level dots
  const rec=ACTIVE_STORE.records[q.id];
  const level=rec?rec.reviewLevel:0;
  let dotsHtml='<div class="q-review-dots">';
  for(let i=0;i<5;i++){dotsHtml+=`<div class="q-review-dot${i<level?(level>=5?' max':' filled'):''}"></div>`;}
  dotsHtml+='</div>';
  const reviewLabel=level>=5?'✅ 已掌握':'📅 '+REVIEW_LABELS[level];

  const kpBadge=q.keypoints&&q.keypoints.length>0?`<span class="q-kp-badge" onclick="this.classList.toggle('open');event.stopPropagation()"><span class="kp-label">💡 考点</span><span class="kp-tags">${q.keypoints.join(' / ')}</span></span>`:'';

  let html=`<div class="q-type-bar">
    <span class="q-type-tag ${typeClass}">${typeLabel}</span>
    <span class="q-source">${q.source||''} ${q.year?'('+q.year+')':''}</span>
    ${answerHint}${kpBadge}
  </div>
  <div class="q-review-indicator">${dotsHtml}<span>${reviewLabel}</span></div>
  <div class="q-text">${escHtml(q.q)}</div><div class="q-options">`;

  ['A','B','C','D'].forEach(letter=>{
    if(q.opts[letter]){
      html+=`<div class="q-option" data-letter="${letter}" onclick="selectOpt(this,'${letter}')"><span class="opt-mark">${letter}</span><span>${escHtml(q.opts[letter])}</span><span class="unsure-btn" data-letter="${letter}" onclick="event.stopPropagation();toggleUnsure(this,'${letter}')" style="display:none">? 不确定</span></div>`;
    }
  });
  html+='</div>';
  const diagramsHtml=q.diagrams&&q.diagrams.length>0?`<div class="q-diagrams">${q.diagrams.map(d=>`<img src="diagrams/${d}" alt="解析配图" onclick="window.open(this.src,'_blank')">`).join('')}</div>`:'';
  html+=`<button class="q-submit-btn" id="qSubmitBtn" onclick="submitAnswer()" disabled>提交答案</button>`;
  html+=`<div class="q-explanation" id="qExplanation"><div class="exp-label">📝 解析</div><div class="exp-text">${escHtml(q.exp||'暂无解析')}</div>${diagramsHtml}</div>`;
  html+=`<button class="q-next-btn" id="qNextBtn" onclick="nextQuestion()">下一题 →</button>`;

  document.getElementById('quiz-body').innerHTML=html;
  document.getElementById('quiz-body').scrollTop=0;
}

function selectOpt(el,letter){
  if(QUIZ_SUBMITTED)return;
  const q=QUIZ_QUESTIONS[QUIZ_INDEX];
  const qType=q.type||(q.ans.length>1?'multi':'single');
  const isMulti=qType!=='single';
  if(isMulti){
    if(QUIZ_SELECTED.includes(letter)){QUIZ_SELECTED=QUIZ_SELECTED.filter(l=>l!==letter);el.classList.remove('selected');}
    else{QUIZ_SELECTED.push(letter);el.classList.add('selected');}
  }else{document.querySelectorAll('.q-option').forEach(o=>o.classList.remove('selected'));QUIZ_SELECTED=[letter];el.classList.add('selected');}
  document.getElementById('qSubmitBtn').disabled=QUIZ_SELECTED.length===0;
}

function toggleUnsure(btn,letter){
  if(!QUIZ_SUBMITTED)return;
  btn.classList.toggle('active');
  const q=QUIZ_QUESTIONS[QUIZ_INDEX];
  const rec=getReviewRecord(q.id);
  if(!rec.unsureOpts)rec.unsureOpts=[];
  if(btn.classList.contains('active')){if(!rec.unsureOpts.includes(letter))rec.unsureOpts.push(letter);}
  else{rec.unsureOpts=rec.unsureOpts.filter(u=>u!==letter);}
  saveActiveStore();
}

function submitAnswer(){
  if(QUIZ_SUBMITTED||QUIZ_SELECTED.length===0)return;
  QUIZ_SUBMITTED=true;
  const q=QUIZ_QUESTIONS[QUIZ_INDEX];
  const correctAns=q.ans.slice().sort().join('');
  const userAns=QUIZ_SELECTED.slice().sort().join('');
  const isCorrect=correctAns===userAns;

  document.querySelectorAll('.q-option').forEach(el=>{
    el.classList.add('locked');
    const letter=el.dataset.letter;
    el.querySelector('.unsure-btn').style.display='';
    if(q.ans.includes(letter))el.classList.add('correct');
    if(QUIZ_SELECTED.includes(letter)&&!q.ans.includes(letter))el.classList.add('wrong');
  });

  // Update record
  const rec=getReviewRecord(q.id);
  rec.attempts++;rec.lastAnswer=[...QUIZ_SELECTED];rec.lastResult=isCorrect;
  if(isCorrect){rec.correct++;QUIZ_RESULT.correct++;}
  else{QUIZ_RESULT.wrong++;}

  // Update spaced repetition
  updateReviewLevel(q.id, isCorrect);

  const expEl=document.getElementById('qExplanation');
  expEl.querySelector('.exp-label').textContent=(isCorrect?'✅ 回答正确！':'❌ 回答错误，正确答案：'+correctAns);
  expEl.classList.add('show');

  // Update review indicator
  const newLevel=ACTIVE_STORE.records[q.id].reviewLevel;
  const ri=document.querySelector('.q-review-indicator');
  if(ri){
    let dots='<div class="q-review-dots">';
    for(let i=0;i<5;i++){dots+=`<div class="q-review-dot${i<newLevel?(newLevel>=5?' max':' filled'):''}"></div>`;}
    dots+='</div>';
    ri.innerHTML=dots+'<span>'+(newLevel>=5?'✅ 已掌握':'📅 '+REVIEW_LABELS[newLevel])+'</span>';
  }

  document.getElementById('qSubmitBtn').style.display='none';
  document.getElementById('qNextBtn').classList.add('show');
  document.getElementById('qNextBtn').textContent=QUIZ_INDEX>=QUIZ_QUESTIONS.length-1?'查看结果 →':'下一题 →';
  expEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function nextQuestion(){
  QUIZ_INDEX++;
  if(QUIZ_INDEX>=QUIZ_QUESTIONS.length)showQuizSummary();
  else renderQuestion();
}

function showQuizSummary(){
  const total=QUIZ_RESULT.correct+QUIZ_RESULT.wrong;
  const pct=total>0?Math.round(QUIZ_RESULT.correct/total*100):0;
  const circle=pct>=80?'var(--success-light)':pct>=60?'var(--warning-light)':'var(--danger-light)';

  // Log daily
  logDaily(total, QUIZ_RESULT.correct);

  document.getElementById('summaryContent').innerHTML=`
    <h2>本轮完成！</h2>
    <div class="qs-circle" style="background:${circle}"><div class="pct">${pct}%</div><div class="label">正确率</div></div>
    <div class="qs-details">
      <div class="item"><div class="num" style="color:var(--success)">${QUIZ_RESULT.correct}</div><div>正确</div></div>
      <div class="item"><div class="num" style="color:var(--danger)">${QUIZ_RESULT.wrong}</div><div>错误</div></div>
      <div class="item"><div class="num">${total}</div><div>总题数</div></div>
    </div>`;
  document.getElementById('summaryModal').classList.add('open');
}

function renderReview(){
  const body=document.getElementById('review-body');
  const dueAll=getDueQuestions(null);
  const totalQs=ACTIVE_STORE.questions.length;
  const mastered=ACTIVE_STORE.questions.filter(q=>ACTIVE_STORE.records[q.id]&&ACTIVE_STORE.records[q.id].reviewLevel>=5).length;
  const unseen=ACTIVE_STORE.questions.filter(q=>!ACTIVE_STORE.records[q.id]).length;
  const inProgress=totalQs-mastered-unseen;

  // Subject breakdown
  let subjDue='';
  for(const[key,subj]of Object.entries(SUBJECTS)){
    const d=getDueQuestions(key).length;
    if(d>0)subjDue+=`<span style="font-size:11px;padding:2px 6px;background:var(--surface3);border-radius:8px;margin:2px;display:inline-block">${subj.name}: ${d}</span>`;
  }

  const schedule=getWeekSchedule(null);
  let schedHtml='';
  schedule.forEach(s=>{
    const cls=s.isToday?'schedule-day today':'schedule-day';
    const color=s.count>0?'var(--accent)':'var(--text3)';
    schedHtml+=`<div class="${cls}"><span class="sd-date">${s.label}</span><span class="sd-label" style="color:${color}">${s.count>0?s.count+' 题':'无安排'}</span></div>`;
  });

  // Daily log (last 7 days)
  const logDates=Object.keys(ACTIVE_STORE.dailyLog).sort().reverse().slice(0,7);
  let logHtml='';
  logDates.forEach(d=>{
    const entry=ACTIVE_STORE.dailyLog[d];
    const acc=entry.count>0?Math.round(entry.correct/entry.count*100):0;
    logHtml+=`<div class="daily-item"><span class="di-date">${d.slice(5)}</span><span class="di-info">${entry.count}题 · 正确${entry.correct}</span><span class="di-count">${acc}%</span></div>`;
  });

  body.innerHTML=`
    <div class="review-hero">
      <div class="rh-today">${dueAll.length}</div>
      <div class="rh-label">今日待复习</div>
      <div class="rh-sub">${subjDue||'全部完成 🎉'}</div>
      <button class="review-start-btn" onclick="startReviewSession()" ${dueAll.length===0?'disabled':''}>
        ${dueAll.length>0?'🔥 开始今日复习':'✅ 今日已完成'}
      </button>
    </div>
    <div class="review-stats-row">
      <div class="review-stat-card"><div class="rsc-val" style="color:var(--accent)">${totalQs}</div><div class="rsc-label">总题数</div></div>
      <div class="review-stat-card"><div class="rsc-val" style="color:var(--success)">${mastered}</div><div class="rsc-label">已掌握</div></div>
      <div class="review-stat-card"><div class="rsc-val" style="color:var(--warning)">${unseen+inProgress}</div><div class="rsc-label">待掌握</div></div>
    </div>
    <div class="review-schedule">
      <div class="review-schedule-title">📅 未来7天复习计划</div>
      ${schedHtml}
    </div>
    ${logDates.length>0?`<div class="daily-log"><div class="daily-log-title"> 最近做题记录</div>${logHtml}</div>`:''}
  `;
}

function startReviewSession(){

  let due=getDueQuestions(null);

}

function renderStats(){
  const body=document.getElementById('stats-body');
  let totalAttempts=0,totalCorrect=0,totalQs=ACTIVE_STORE.questions.length;
  let attempted=0;
  ACTIVE_STORE.questions.forEach(q=>{const r=ACTIVE_STORE.records[q.id];if(r){totalAttempts+=r.attempts;totalCorrect+=r.correct;if(r.attempts>0)attempted++;}});
  const acc=totalAttempts>0?Math.round(totalCorrect/totalAttempts*100):0;
  const completion=totalQs>0?Math.round(attempted/totalQs*100):0;

  let html=`<div class="stats-summary">
    <div class="stats-card"><div class="sc-val">${totalQs}</div><div class="sc-label">总题数</div></div>
    <div class="stats-card"><div class="sc-val">${attempted}</div><div class="sc-label">累计已做</div></div>
    <div class="stats-card"><div class="sc-val">${completion}%</div><div class="sc-label">完成率</div></div>
    <div class="stats-card"><div class="sc-val">${acc}%</div><div class="sc-label">正确率</div></div>
  </div>`;

  // Per-subject table
  html+='<div class="stats-section"><div class="stats-section-title">各科进度</div><table class="stats-table"><thead><tr><th>科目</th><th>总题数</th><th>累计已做</th><th>完成率</th><th>正确率</th></tr></thead><tbody>';
  let tTotal=0,tDone=0,tAtt=0,tCor=0;
  for(const[key,subj]of Object.entries(SUBJECTS)){
    const qs=ACTIVE_STORE.questions.filter(q=>q.subject===key);if(qs.length===0)continue;
    let sAtt=0,sCor=0,sDone=0;
    qs.forEach(q=>{const r=ACTIVE_STORE.records[q.id];if(r){sAtt+=r.attempts;sCor+=r.correct;if(r.attempts>0)sDone++;}});
    const sAcc=sAtt>0?Math.round(sCor/sAtt*100):0;
    const sComp=qs.length>0?Math.round(sDone/qs.length*100):0;
    tTotal+=qs.length;tDone+=sDone;tAtt+=sAtt;tCor+=sCor;
    html+=`<tr><td>${subj.name}</td><td>${qs.length}</td><td>${sDone}</td><td>${sComp}%</td><td>${sAcc}%</td></tr>`;
  }
  const tAcc=tAtt>0?Math.round(tCor/tAtt*100):0;
  const tComp=tTotal>0?Math.round(tDone/tTotal*100):0;
  html+=`<tr class="total-row"><td>合计</td><td>${tTotal}</td><td>${tDone}</td><td>${tComp}%</td><td>${tAcc}%</td></tr>`;
  html+='</tbody></table></div>';

  // Per-subject per-type accuracy table (单选/多选/不定项)
  const TYPES=[{key:'single',label:'单选'},{key:'multi',label:'多选'},{key:'uncertain',label:'不定项'}];
  html+='<div class="stats-section"><div class="stats-section-title">分题型正确率</div>';
  html+='<div style="overflow-x:auto"><table class="stats-table"><thead><tr><th>科目</th>';
  TYPES.forEach(t=>{html+=`<th>${t.label}</th>`;});
  html+='</tr></thead><tbody>';
  const grandTotal={single:{att:0,cor:0},multi:{att:0,cor:0},uncertain:{att:0,cor:0}};
  for(const[key,subj]of Object.entries(SUBJECTS)){
    const qs=ACTIVE_STORE.questions.filter(q=>q.subject===key);if(qs.length===0)continue;
    const typeStats={};
    TYPES.forEach(t=>{typeStats[t.key]={att:0,cor:0};});
    qs.forEach(q=>{
      const r=ACTIVE_STORE.records[q.id];if(!r||r.attempts===0)return;
      const tp=q.type||'single';
      if(typeStats[tp]){typeStats[tp].att+=r.attempts;typeStats[tp].cor+=r.correct;}
    });
    let hasAny=Object.values(typeStats).some(s=>s.att>0);
    if(!hasAny)continue;
    html+=`<tr><td>${subj.name}</td>`;
    TYPES.forEach(t=>{
      const s=typeStats[t.key];
      grandTotal[t.key].att+=s.att;grandTotal[t.key].cor+=s.cor;
      if(s.att>0){
        const a=Math.round(s.cor/s.att*100);
        const cls=a>=80?'color:var(--success)':a>=60?'color:var(--warning)':'color:var(--danger)';
        html+=`<td><span style="font-weight:700;${cls}">${a}%</span><br><span style="font-size:10px;color:var(--text3)">${s.att}次</span></td>`;
      }else{
        html+=`<td style="color:var(--text3);font-size:12px">—</td>`;
      }
    });
    html+='</tr>';
  }
  // Grand total row
  html+='<tr class="total-row"><td>合计</td>';
  TYPES.forEach(t=>{
    const g=grandTotal[t.key];
    if(g.att>0){
      const a=Math.round(g.cor/g.att*100);
      const cls=a>=80?'color:var(--success)':a>=60?'color:var(--warning)':'color:var(--danger)';
      html+=`<td><span style="font-weight:700;${cls}">${a}%</span><br><span style="font-size:10px;color:var(--text3)">${g.att}次</span></td>`;
    }else{
      html+=`<td style="color:var(--text3);font-size:12px">—</td>`;
    }
  });
  html+='</tr></tbody></table></div>';
  html+='<div style="padding:4px 8px;font-size:10px;color:var(--text3)">💡 颜色：≥80% 绿色 · 60-79% 橙色 · <60% 红色</div>';
  html+='</div>';

  // Weakest chapters - per-subject with selector
  html+='<div class="stats-section"><div class="stats-section-title" style="display:flex;align-items:center;justify-content:space-between">';
  html+='<span>薄弱章节 Top 10</span>';
  html+='<select id="weak-subject-select" onchange="renderWeakChapters(this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px">';
  html+='<option value="all">全部科目</option>';
  for(const[key,subj]of Object.entries(SUBJECTS)){
    const qs=ACTIVE_STORE.questions.filter(q=>q.subject===key);
    if(qs.length>0)html+=`<option value="${key}">${subj.name}</option>`;
  }
  html+='</select></div>';
  html+='<div id="weak-chapters-content"></div></div>';

  // Daily log chart
  const logDates=Object.keys(ACTIVE_STORE.dailyLog).sort().slice(-14);
  if(logDates.length>0){
    html+='<div class="stats-section"><div class="stats-section-title"> 每日做题趋势</div><div class="bar-chart">';
    const maxCount=Math.max(...logDates.map(d=>ACTIVE_STORE.dailyLog[d].count));
    logDates.forEach(d=>{
      const entry=ACTIVE_STORE.dailyLog[d];
      const pct=maxCount>0?Math.round(entry.count/maxCount*100):0;
      const acc=entry.count>0?Math.round(entry.correct/entry.count*100):0;
      html+=`<div class="bar-row"><div class="bar-label">${d.slice(5)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div></div><div class="bar-val">${entry.count}题 ${acc}%</div></div>`;
    });
    html+='</div></div>';
  }

  body.innerHTML=html;
  renderWeakChapters('all'); // Render weak chapters table initially
}

// Render weak chapters by subject
function renderWeakChapters(subjectFilter){
  const container=document.getElementById('weak-chapters-content');
  if(!container)return;
  const qs=subjectFilter==='all'?ACTIVE_STORE.questions:ACTIVE_STORE.questions.filter(q=>q.subject===subjectFilter);
  const chapterStats={};
  qs.forEach(q=>{
    const ch=q.chapter||'未分类';
    const sub=q.subject;
    const key=subjectFilter==='all'?sub+'|||'+ch:ch;
    if(!chapterStats[key])chapterStats[key]={chapter:ch,subject:sub,attempts:0,correct:0};
    const r=ACTIVE_STORE.records[q.id];
    if(r){chapterStats[key].attempts+=r.attempts;chapterStats[key].correct+=r.correct;}
  });
  const weakChapters=Object.values(chapterStats)
    .filter(v=>v.attempts>=3)
    .sort((a,b)=>(a.correct/a.attempts)-(b.correct/b.attempts))
    .slice(0,10);
  if(weakChapters.length===0){
    container.innerHTML='<div class="empty-state" style="padding:20px"><div class="es-text" style="color:var(--text3)">暂无足够数据（需至少做3题）</div></div>';
    return;
  }
  let html='<table class="stats-table"><thead><tr>';
  if(subjectFilter==='all')html+='<th>科目</th>';
  html+='<th>章节</th><th>做题数</th><th>正确率</th></tr></thead><tbody>';
  weakChapters.forEach(v=>{
    const wAcc=v.attempts>0?Math.round(v.correct/v.attempts*100):0;
    const subjName=SUBJECTS[v.subject]?.name||v.subject;
    const color=wAcc<50?'var(--danger)':wAcc<70?'var(--warning)':'var(--success)';
    html+='<tr>';
    if(subjectFilter==='all')html+=`<td>${subjName}</td>`;
    html+=`<td style="text-align:left;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(v.chapter)}">${escHtml(v.chapter.length>20?v.chapter.substring(0,18)+'...':v.chapter)}</td>`;
    html+=`<td>${v.attempts}</td>`;
    html+=`<td style="color:${color};font-weight:600">${wAcc}%</td>`;
    html+='</tr>';
  });
  html+='</tbody></table>';
  container.innerHTML=html;
}

// ================================================================
//  SETTINGS
// ================================================================
function renderSettings(){
  const body=document.getElementById('settings-body');
  const s=STORE.settings;
  const themeLabel=s.theme==='dark'?'深色':s.theme==='light'?'浅色':'跟随系统';
  const fsLabel=s.fontSize==='small'?'小':s.fontSize==='large'?'大':'中';
  const mastered=STORE.questions.filter(q=>STORE.records[q.id]&&STORE.records[q.id].reviewLevel>=5).length;

  body.innerHTML=`
    <div class="setting-group"><div class="setting-group-title">外观</div>
      <div class="setting-item" onclick="cycleTheme()"><span class="si-label">主题模式</span><span class="si-value">${themeLabel} →</span></div>
      <div class="setting-item" onclick="cycleFontSize()"><span class="si-label">字体大小</span><span class="si-value">${fsLabel} →</span></div>
    </div>
    <div class="setting-group"><div class="setting-group-title">数据</div>
      <button class="setting-btn" style="background:var(--accent);color:#fff;border:none" onclick="syncFromServer()">🔄 从服务器同步真金题</button>
      <button class="setting-btn" style="background:#8b5cf6;color:#fff;border:none" onclick="loadMutiQuestions()">⭐ 更新母题题库 (${MUTI_STORE.questions.length}题)</button>
      <button class="setting-btn" onclick="exportData()">📤 导出 JSON 备份</button>
      <button class="setting-btn" onclick="document.getElementById('jsonFileInput').click()">📥 导入 JSON 题库</button>
      <button class="setting-btn danger" onclick="clearData()">🗑 清空所有数据</button>
    </div>
    <div class="setting-group"><div class="setting-group-title">关于</div>
      <div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text3)">
        法考真金题 v2.0（冲刺版）<br>
        真金题：${STORE.questions.length} 题 · 已掌握：${mastered} 题<br>
        母题精选：${MUTI_STORE.questions.length} 题（独立题库）<br>
        复习算法：艾宾浩斯遗忘曲线（14天冲刺）
      </div>
    </div>`;
}

function cycleTheme(){
  const themes=['auto','light','dark'];const idx=themes.indexOf(STORE.settings.theme);
  STORE.settings.theme=themes[(idx+1)%themes.length];applySettings();saveStore();renderSettings();
}
function cycleFontSize(){
  const sizes=['small','medium','large'];const idx=sizes.indexOf(STORE.settings.fontSize);
  STORE.settings.fontSize=sizes[(idx+1)%sizes.length];applySettings();saveStore();renderSettings();
}

// ================================================================
//  IMPORT / EXPORT
// ================================================================
function exportData(){
  // Export both stores in one backup file
  const backup=JSON.stringify({zhenti:STORE,muti:MUTI_STORE,exportDate:todayStr()},null,2);
  const blob=new Blob([backup],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='法考题库备份_'+todayStr()+'.json';a.click();URL.revokeObjectURL(url);
}

function handleJSONFile(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      // Support new backup format {zhenti:..., muti:...} and old format {questions:[...]}
      let imported=[], mutiImported=[];
      if(data.zhenti&&data.zhenti.questions){
        imported=data.zhenti.questions||[];
        mutiImported=(data.muti&&data.muti.questions)||[];
      }else{
        imported=data.questions||[];
      }
      if(imported.length===0&&mutiImported.length===0){alert('❌ JSON 文件中没有找到题目！');return;}
      let count=0;
      imported.forEach(item=>{
        let ans=item.ans||item.answer||[];if(typeof ans==='string')ans=ans.split('');
        const q={
          id:item.id||('imp_'+Date.now()+'_'+count),
          subject:item.subject||detectSubject(item),
          book:item.book||'',chapter:item.chapter||'未分类',
          year:item.year||null,source:item.source||item.meta||'',
          type:item.type||(ans.length>1?'multi':'single'),
          answerCount:ans.length,q:item.q||item.question||'',
          opts:item.opts||item.options||{},ans:ans,
          exp:item.exp||item.explanation||'',
          keypoints:item.keypoints||[],difficulty:item.difficulty||null,page:item.page||null,
        };
        if(q.q&&Object.keys(q.opts).length>=2&&q.ans.length>0){
          if(!STORE.questions.find(existing=>existing.id===q.id)){STORE.questions.push(q);count++;}
        }
      });
      // Import muti questions if present
      let mutiCount=0;
      mutiImported.forEach(item=>{
        let ans=item.ans||item.answer||[];if(typeof ans==='string')ans=ans.split('');
        const q={
          id:item.id||('muti_imp_'+Date.now()+'_'+mutiCount),
          subject:item.subject||detectSubject(item),
          book:item.book||'母题精选',chapter:item.chapter||'母题',
          year:item.year||2026,source:item.source||'母题',
          type:item.type||(ans.length>1?'multi':'single'),
          answerCount:ans.length,q:item.q||item.question||'',
          opts:item.opts||item.options||{},ans:ans,
          exp:item.exp||item.explanation||'',
          keypoints:item.keypoints||[],difficulty:item.difficulty||null,page:item.page||null,
          diagrams:item.diagrams||[],
        };
        if(q.q&&Object.keys(q.opts).length>=2&&q.ans.length>0){
          if(!MUTI_STORE.questions.find(existing=>existing.id===q.id)){MUTI_STORE.questions.push(q);mutiCount++;}
        }
      });
      if(count>0||mutiCount>0){
        saveStore();saveMutiStore();
        alert('✅ 成功导入！\n真金题：'+count+' 道\n母题：'+mutiCount+' 道');
        switchTab('home');
      }else{alert('❌ 未能识别有效题目！');}
    }catch(err){alert('❌ JSON 解析失败：'+err.message);}
  };
  reader.readAsText(file);event.target.value='';
}

function detectSubject(item){
  const topic=(item.topic||item.subject||item.chapter||'').toLowerCase();
  if(topic.includes('民诉'))return'ms';if(topic.includes('刑法'))return'xk';
  if(topic.includes('民法'))return'mf';if(topic.includes('刑诉'))return'xs';
  if(topic.includes('行政'))return'xz';if(topic.includes('商经'))return'sj';
  if(topic.includes('三国'))return'sg';if(topic.includes('理论')||topic.includes('法理'))return'll';
  return'ms';
}

function clearData(){
  if(confirm('⚠️ 确定清空所有题目和答题记录？此操作不可撤销！')){
    if(confirm('再次确认：清空所有数据？')){
      const savedSettings=STORE.settings;
      STORE={version:2,questions:[],records:{},dailyLog:{},settings:savedSettings};
      MUTI_STORE={version:1,questions:[],records:{},dailyLog:{}};
      saveStore();saveMutiStore();switchTab('home');
    }
  }
}

function escHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML;}

// Auto-load题库 from server (data.json) - updates content AND preserves records
async function autoLoadFromServer(){
  try{
    const resp=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!resp.ok)return;
    const data=await resp.json();
    const imported=data.questions||[];
    if(imported.length===0)return;
    let newCount=0,updateCount=0;
    imported.forEach(item=>{
      let ans=item.ans||item.answer||[];if(typeof ans==='string')ans=ans.split('');
      const q={
        id:item.id||('imp_'+Date.now()+'_'+newCount),
        subject:item.subject||detectSubject(item),
        book:item.book||'',chapter:item.chapter||'未分类',
        year:item.year||null,source:item.source||item.meta||'',
        type:item.type||(ans.length>1?'multi':'single'),
        answerCount:ans.length,q:item.q||item.question||'',
        opts:item.opts||item.options||{},ans:ans,
        exp:item.exp||item.explanation||'',
        keypoints:item.keypoints||[],difficulty:item.difficulty||null,page:item.page||null,
        diagrams:item.diagrams||[],
      };
      if(q.q&&Object.keys(q.opts).length>=2&&q.ans.length>0){
        const existing=STORE.questions.find(e=>e.id===q.id);
        if(existing){
          // Update content (exp, keypoints, etc.) - records are separate and preserved
          Object.assign(existing,q);
          updateCount++;
        }else{
          STORE.questions.push(q);
          newCount++;
        }
      }
    });
    if(newCount>0||updateCount>0){
      saveStore();
      const msg=newCount>0?`✅ 加载 ${newCount} 道新题`:`✅ 更新 ${updateCount} 道题`;
      showToast(msg);
      renderHome();
    }
  }catch(e){/* 本地打开时无服务器，静默跳过 */}
}
function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:opacity .5s';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),500);},2500);
}

// Init
loadStore();renderHome();
autoLoadFromServer(); // Always sync from server - updates question content, preserves records
